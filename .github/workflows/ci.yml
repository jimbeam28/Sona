name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check test coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | grep -oP '[\d.]+%' | head -1 | tr -d '%')
          echo "Test coverage: ${COVERAGE}%"
          THRESHOLD=60
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Test coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Check architecture boundaries
        # 与本地 dev-exe/cr/dev-check 共用同一门禁脚本（单一事实源）：
        # feature 隔离 + Domain 零平台依赖 + 日志敏感词；legacy debt 在 docs/dev/arch-baseline.txt 登记抑制
        run: |
          bash .claude/plugins/sona-dev/scripts/cross-imports.sh all || {
            echo "::error::Architecture boundary violation(s) found. Fix the code (do NOT extend docs/dev/arch-baseline.txt)."
            exit 1
          }

      - name: Check file line count limit
        run: |
          echo "Checking for files exceeding 500 lines..."
          EXCEEDED=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "::error file=$file::File has $lines lines, exceeding the 500-line limit"
              EXCEEDED=$((EXCEEDED + 1))
            fi
          done < <(find lib -name '*.dart' -type f)
          if [ "$EXCEEDED" -gt 0 ]; then
            echo "::error::$EXCEEDED file(s) exceed the 500-line limit. Please refactor."
            exit 1
          fi
          echo "All files are within the 500-line limit."

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk